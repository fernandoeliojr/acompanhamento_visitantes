<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - IEQ - NE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="sidebar">
        <h2>IEQ - NE</h2>
        <a href="/" class="active">Painel</a>
        <a href="/visitantes">Visitantes</a>
        <a href="/relatorios">Relatórios</a>
    </nav>

    <main class="main-content">
        <section class="kpi-container">
            <h2>Resumo de Dados</h2>
            <div style="display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; flex-wrap: wrap;">
                {% if status_data %}
                <div style="background: var(--card-bg); padding: 20px; border-radius: var(--radius); min-width: 180px; text-align: center;">
                    <h4 style="margin: 0 0 10px 0; color: var(--text); font-size: 0.9rem;">Total de Visitantes</h4>
                    <div style="font-size: 2rem; font-weight: bold; color: var(--primary);">{{ visitors|length }}</div>
                </div>
                {% endif %}
                {% if status_data %}
                <div style="background: var(--card-bg); padding: 20px; border-radius: var(--radius); min-width: 180px; text-align: center;">
                    <h4 style="margin: 0 0 10px 0; color: var(--text); font-size: 0.9rem;">Total por Status</h4>
                    <div style="font-size: 2rem; font-weight: bold; color: var(--primary);">{{ visitors|length }}</div>
                </div>
                {% endif %}
            </div>
        </section>

        <section class="bento-card">
            <h2>Distribuição de Status</h2>
            <canvas id="statusChart"></canvas>
        </section>

        <section class="bento-card">
            <h2>Visitantes por Mês</h2>
            <canvas id="monthChart"></canvas>
        </section>
    </main>

    <script>
        // Dados de status - vêm do Flask
        const statusData = {{ status_data|tojson }};
        const monthData = {{ month_data|tojson }};

        // Gráfico de distribuição de status
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'pie',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: ['#1e3a8a', '#f59e0b', '#10b981', '#ef4444', '#6b7280']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'bottom'
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.label}: ${context.parsed} visitantes`;
                            }
                        }
                    }
                }
            }
        });

        // Gráfico de visitantes por mês
        const monthCtx = document.getElementById('monthChart').getContext('2d');
        new Chart(monthCtx, {
            type: 'bar',
            data: {
                labels: Object.keys(monthData).map(k => k),
                datasets: [{
                    label: 'Visitantes',
                    data: Object.values(monthData),
                    backgroundColor: '#1e3a8a',
                    borderColor: '#1e3a8a',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const [year, month] = context.label.split('-');
                                return ` ${year}/${month}: ${context.parsed} visitantes`;
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
